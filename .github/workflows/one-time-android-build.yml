name: One-time Android alpha compile
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble-debug:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'one-time alpha compile')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: obywatel-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: obywatel-android-alpha-debug
          path: obywatel-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Report failure context
        if: failure()
        run: echo 'One-time alpha compile failed. Inspect the failing Gradle step and logs.'

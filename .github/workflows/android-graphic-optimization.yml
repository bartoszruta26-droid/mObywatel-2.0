name: Android graphic optimization and thumbnails

on:
  push:
    branches:
      - integration/graphic-optimization-mainline
    paths:
      - "scripts/optimize_android_graphics.py"
      - "scripts/test_optimize_android_graphics.py"
      - ".github/workflows/android-graphic-optimization.yml"
      - "obywatel-android/app/src/main/res/**"
      - "obywatel-android/app/src/main/assets/graphic-thumbnails/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/optimize_android_graphics.py"
      - "scripts/test_optimize_android_graphics.py"
      - ".github/workflows/android-graphic-optimization.yml"
      - "obywatel-android/app/src/main/res/**"
      - "obywatel-android/app/src/main/assets/graphic-thumbnails/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-graphic-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request or optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Test image optimization and duplicate-resource cleanup
        run: python -m unittest scripts/test_optimize_android_graphics.py
      - name: Verify committed optimized resources and thumbnail manifest
        run: |
          python scripts/optimize_android_graphics.py
          git diff --exit-code -- obywatel-android/app/src/main/res obywatel-android/app/src/main/assets/graphic-thumbnails

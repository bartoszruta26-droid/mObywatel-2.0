name: Android graphic optimization and thumbnails

on:
  push:
    branches:
      - perf/android-graphic-webp-thumbnails
    paths:
      - "scripts/optimize_android_graphics.py"
      - ".github/workflows/android-graphic-optimization.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/optimize_android_graphics.py"
      - ".github/workflows/android-graphic-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-graphic-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'perf/android-graphic-webp-thumbnails' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert eligible resources and generate thumbnails
        run: python scripts/optimize_android_graphics.py
      - name: Commit generated resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obywatel-android/app/src/main/res obywatel-android/app/src/main/assets/graphic-thumbnails
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[asset optimization] Convert large Android images and add thumbnails"
          git push origin HEAD:${{ github.head_ref || 'perf/android-graphic-webp-thumbnails' }}

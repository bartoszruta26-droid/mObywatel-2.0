name: Android GUI validation

on:
  push:
    branches: [main]
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-gui.yml"
  pull_request:
    branches: [main]
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: obywatel-android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build DSS PAdES validation module
        working-directory: obywatel-android
        run: gradle --no-daemon :pades-validator:build

      - name: Enable KVM access for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable on this runner; emulator will use software acceleration."
          fi

      - name: Run Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save
          script: |
            cd obywatel-android && gradle --no-daemon :app:connectedDebugAndroidTest || { echo "Android instrumentation failed; collecting emulator diagnostics."; adb devices -l || true; adb logcat -d -v threadtime | tail -n 500 || true; exit 1; }

      - name: Assemble Android debug APK
        working-directory: obywatel-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obywatel-android-debug
          path: obywatel-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Audit external institutional symbol repositories

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - "scripts/audit-upstream-symbol-sources.mjs"
      - "docs/identity-assets/external-repository-sources.csv"
      - ".github/workflows/audit-upstream-symbol-sources.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch public upstream repository indexes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-upstream-symbol-sources.mjs
      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: upstream-institutional-symbol-inventory
          path: |
            build/upstream-symbol-audit.json
            build/upstream-symbol-candidates.csv
          if-no-files-found: error
          retention-days: 30
      - name: Stage generated candidate index
        run: |
          mkdir -p docs/identity-assets/generated
          cp build/upstream-symbol-audit.json docs/identity-assets/generated/upstream-symbol-audit.json
          cp build/upstream-symbol-candidates.csv docs/identity-assets/generated/upstream-symbol-candidates.csv
      - name: Open pull request with generated candidate index
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add generated upstream symbol candidate index"
          branch: automation/upstream-symbol-candidate-index
          delete-branch: true
          title: "Add generated index of 2,000+ symbol candidates"
          body: |
            Automated source inventory generated from public GitHub repositories and Wikimedia Commons.
            This pull request contains candidate metadata only. It does not grant permission to use or redistribute any logo, coat of arms, emblem or flag.
            Protected and unverified entries must remain reference-only until their individual rights are reviewed.
          add-paths: |
            docs/identity-assets/generated/upstream-symbol-audit.json
            docs/identity-assets/generated/upstream-symbol-candidates.csv

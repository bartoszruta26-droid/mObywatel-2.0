name: Institutional symbol catalog validation

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "docs/identity-assets/**"
      - "scripts/validate-institutional-symbol-catalog.mjs"
      - ".github/workflows/institutional-symbol-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/identity-assets/**"
      - "scripts/validate-institutional-symbol-catalog.mjs"
      - ".github/workflows/institutional-symbol-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source, candidate and approved-import manifests
        run: node scripts/validate-institutional-symbol-catalog.mjs
      - name: Verify approved-asset importer safely no-ops on empty allowlist
        run: node scripts/import-approved-symbol-assets.mjs

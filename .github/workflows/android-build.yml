name: Android prototype build

on:
  push:
    branches: [main]
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android JVM unit tests
        working-directory: obywatel-android
        run: gradle --no-daemon :app:testDebugUnitTest :pades-validator:test

      - name: Build Android debug APK
        working-directory: obywatel-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obywatel-android-debug
          path: obywatel-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

name: Android prototype build

on:
  push:
    branches: [main]
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android JVM unit tests
        working-directory: obywatel-android
        run: gradle --no-daemon :app:testDebugUnitTest :pades-validator:test

      - name: Configure stable Android signing key
        id: configure-stable-signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Stable signing secrets are not configured; building an unsigned-for-release debug variant with the runner debug key. Do not distribute this APK as an update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIGNING_DIR="$RUNNER_TEMP/android-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/upload-key.p12"
          chmod 600 "$SIGNING_DIR/upload-key.p12"
          echo "ANDROID_KEYSTORE_FILE=$SIGNING_DIR/upload-key.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build Android debug APK
        working-directory: obywatel-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obywatel-android-debug
          path: obywatel-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

# Validation rerun: 2026-11-12 — build current integrated main.
# Main build refresh: 2026-11-13 — compile APK from post-merge main.

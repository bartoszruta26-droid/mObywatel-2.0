---
name: REUSE Compliance Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reuse-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6

# Android module compilation smoke test
# SPDX-License-Identifier: CC0-1.0
name: Android prototype build

on:
  push:
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-prototype.yml"
  pull_request:
    paths:
      - "obywatel-android/**"
      - ".github/workflows/android-prototype.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        working-directory: obywatel-android
        run: gradle wrapper --gradle-version 8.9

      - name: Assemble debug APK
        working-directory: obywatel-android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obywatel-android-debug
          path: obywatel-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
